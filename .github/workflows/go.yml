name: 'Go'
on:
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
  merge_group:
    branches:
      - 'master'
permissions:
  contents: 'read'
jobs:
  cover:
    name: 'Coverage'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: 'audit'
      - name: 'Set up Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Get Dependencies'
        run: |
          go get -v -t ./...
      - name: 'Test'
        run: |
          go test -race -coverprofile=coverage.txt -covermode=atomic -v ./...
      - name: 'Coverage'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  build:
    name: 'Build and Test'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        go:
          - '1.25'
          - '1.26'
          - '1.27'
      fail-fast: false
    steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: 'audit'
      - name: 'Set up Go ${{ matrix.go }}'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Get Dependencies'
        run: |
          go get -v -t ./...
      - name: 'Build'
        run: |
          go build -v ./...
      - name: 'Test'
        run: |
          go test -race -shuffle=on -v ./...
  fuzz:
    name: 'Fuzz (${{ matrix.target.label }})'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        target:
          - package: '.'
            func: 'FuzzDecode'
            label: 'Decode'
          - package: '.'
            func: 'FuzzNormalize'
            label: 'Normalize'
          - package: './algorithm/scrypt'
            func: 'FuzzDecodeAndMatch'
            label: 'Scrypt Decode and Match'
      fail-fast: false
    steps:
      - name: 'Harden Runner'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: 'audit'
      - name: 'Set up Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Get Dependencies'
        run: |
          go get -v -t ./...
      - name: 'Fuzz ${{ matrix.target.func }}'
        run: |
          go test -run '^$' -fuzz '^${{ matrix.target.func }}$' -fuzztime 120s ${{ matrix.target.package }}
      - name: 'Show Failing Corpus'
        if: failure()
        run: |
          find . -path '*/testdata/fuzz/*' -type f -print -exec cat {} \;
